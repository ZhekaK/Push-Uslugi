<!DOCTYPE html>
<html lang="ru">
<head>
  <meta charset="utf-8">
  <meta http-equiv="Content-Type" content="text/html; charset=utf-8">
  <meta name="viewport" content="width=device-width, height=device-height, initial-scale=1.0, user-scalable=no">

  <title>Пыш-Услуги</title>
  <link rel="icon" type="image/png" href="favicon.png">

  <style>
    html, body {
      margin: 0;
      padding: 0;
      width: 100%;
      height: 100%;
      overflow: hidden;
      background: #e5e5e5;
      font-family: Arial, sans-serif;
    }

    #unity-container {
      position: fixed;
      inset: 0;
      width: 100vw;
      height: 100vh;
      overflow: hidden;
      background: #e5e5e5;
    }

    #unity-canvas {
      width: 100%;
      height: 100%;
      display: block;
      background: #e5e5e5;
    }

    #loading-screen {
      position: fixed;
      inset: 0;
      z-index: 10;
      background: #e5e5e5;
      display: flex;
      flex-direction: column;
      align-items: center;
    }

    #loading-logo {
      width: 86px;
      height: 86px;
      object-fit: contain;
      margin-top: 26px;
    }

    #loading-spinner {
      position: absolute;
      top: 50%;
      left: 50%;
      width: 42px;
      height: 42px;
      margin-left: -21px;
      margin-top: -21px;

      border: 5px solid rgba(0, 92, 185, 0.18);
      border-top: 5px solid #005cb9;
      border-radius: 50%;

      animation: spin 0.85s linear infinite;
    }

    @keyframes spin {
      from { transform: rotate(0deg); }
      to { transform: rotate(360deg); }
    }
  </style>
</head>

<body>
  <div id="loading-screen">
    <img id="loading-logo" src="favicon.png" alt="Пыш-Услуги">
    <div id="loading-spinner"></div>
  </div>

  <div id="unity-container">
    <canvas id="unity-canvas" tabindex="-1"></canvas>
  </div>

  <script src="Build/Push-Uslugi.loader.js"></script>

  <script>
    const canvas = document.querySelector("#unity-canvas");
    const loadingScreen = document.querySelector("#loading-screen");

    createUnityInstance(canvas, {
      arguments: [],
      dataUrl: "Build/Push-Uslugi.data",
      frameworkUrl: "Build/Push-Uslugi.framework.js",
      codeUrl: "Build/Push-Uslugi.wasm",
      streamingAssetsUrl: "StreamingAssets",
      companyName: "Kartofan Studio",
      productName: "Push-Uslugi",
      productVersion: "1.0.0"
    }).then((unityInstance) => {
      loadingScreen.style.display = "none";
    }).catch((message) => {
      alert(message);
    });
  </script>
</body>
</html>
